<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexLead | Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f8fafc; --card: #fff; --blue: #0A2463; --purple: #3E92CC; --green: #2ECC71; --red: #ef4444; --orange: #f59e0b; --text: #1a202c; --sub: #64748b; --border: #e2e8f0; --shadow: 0 4px 15px rgba(0,0,0,0.05); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .locked { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, var(--blue), var(--purple)); color: white; }
    .locked h1 { font-size: 2.5em; margin-bottom: 20px; }
    .locked input { padding: 14px 20px; border-radius: 10px; border: none; font-size: 1em; font-family: 'Plus Jakarta Sans', sans-serif; width: 280px; }
    .locked button { padding: 14px 28px; background: var(--green); color: #fff; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1em; margin-left: 8px; }
    .container { max-width: 1400px; margin: 0 auto; padding: 30px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
    .header h1 { font-size: 2em; font-weight: 700; color: var(--blue); }
    .header .date { color: var(--sub); font-size: 0.9em; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
    .stat-card { background: var(--card); border-radius: 16px; padding: 24px; box-shadow: var(--shadow); border: 1px solid var(--border); transition: transform 0.3s; }
    .stat-card:hover { transform: translateY(-4px); }
    .stat-card .label { color: var(--sub); font-size: 0.85em; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
    .stat-card .value { font-size: 2.5em; font-weight: 800; }
    .stat-card .sub { color: var(--sub); font-size: 0.8em; margin-top: 4px; }
    .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 40px; }
    .panel { background: var(--card); border-radius: 16px; padding: 24px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .panel h2 { font-size: 1.2em; font-weight: 600; margin-bottom: 20px; color: var(--blue); }
    .bar { height: 24px; border-radius: 12px; margin-bottom: 12px; background: #f1f5f9; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 12px; transition: width 0.5s ease; }
    .bar-label { display: flex; justify-content: space-between; font-size: 0.85em; margin-bottom: 6px; color: var(--sub); }
    .lead-table { width: 100%; border-collapse: collapse; }
    .lead-table th { text-align: left; color: var(--sub); font-weight: 600; padding: 12px; border-bottom: 2px solid var(--border); font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px; background: #f8fafc; }
    .lead-table td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 0.9em; }
    .lead-table tr:hover { background: #f8fafc; }
    .badge { padding: 4px 12px; border-radius: 20px; font-size: 0.75em; font-weight: 600; }
    .badge-CHAUD { background: #fecaca; color: #991b1b; }
    .badge-TIEDE { background: #fed7aa; color: #9a3412; }
    .badge-FROID { background: #bfdbfe; color: #1e40af; }
    .btn-refresh { background: var(--blue); color: #fff; border: none; padding: 10px 24px; border-radius: 10px; font-weight: 600; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.9em; transition: all 0.3s; }
    .btn-refresh:hover { background: #1e3a8a; transform: translateY(-2px); }
    .last-update { color: var(--sub); font-size: 0.85em; margin-top: 20px; text-align: right; }
    .loading { text-align: center; padding: 40px; color: var(--sub); }
    @media (max-width: 900px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } .chart-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="locked" id="lockScreen">
  <h1>🔒 NexLead Dashboard</h1>
  <div>
    <input type="password" id="passInput" placeholder="Mot de passe..." onkeypress="if(event.key==='Enter') unlock()">
    <button onclick="unlock()">Accéder</button>
  </div>
</div>

<div class="container" id="mainContent" style="display:none;">
  <div class="header">
    <div>
      <h1>📊 NexLead Dashboard</h1>
      <p class="date" id="currentDate"></p>
    </div>
    <button class="btn-refresh" onclick="loadDashboard()">↻ Actualiser</button>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="label">Total Leads</div>
      <div class="value" id="total" style="color:var(--blue);">-</div>
      <div class="sub" id="todayLeads"></div>
    </div>
    <div class="stat-card">
      <div class="label">Chauds 🔥</div>
      <div class="value" id="hot" style="color:var(--red);">-</div>
      <div class="sub">Priorité élevée</div>
    </div>
    <div class="stat-card">
      <div class="label">Tièdes 🟡</div>
      <div class="value" id="warm" style="color:var(--orange);">-</div>
      <div class="sub">En cours</div>
    </div>
    <div class="stat-card">
      <div class="label">Froids 🟢</div>
      <div class="value" id="cold" style="color:var(--green);">-</div>
      <div class="sub">Nurturing</div>
    </div>
  </div>

  <div class="chart-row">
    <div class="panel">
      <h2>📈 Répartition des Leads</h2>
      <div class="bar-label"><span>Chauds</span><span id="hotPct">0%</span></div>
      <div class="bar"><div class="bar-fill" id="hotBar" style="width:0%;background:var(--red);"></div></div>
      <div class="bar-label"><span>Tièdes</span><span id="warmPct">0%</span></div>
      <div class="bar"><div class="bar-fill" id="warmBar" style="width:0%;background:var(--orange);"></div></div>
      <div class="bar-label"><span>Froids</span><span id="coldPct">0%</span></div>
      <div class="bar"><div class="bar-fill" id="coldBar" style="width:0%;background:var(--green);"></div></div>
    </div>
    <div class="panel">
      <h2>🌍 Leads par Pays</h2>
      <div id="countryStats"><div class="loading">Chargement...</div></div>
    </div>
  </div>

  <div class="panel">
    <h2>📋 Derniers Leads Qualifiés</h2>
    <table class="lead-table">
      <thead>
        <tr><th>Nom</th><th>Entreprise</th><th>Pays</th><th>Email</th><th>Score</th><th>Statut</th><th>Date</th></tr>
      </thead>
      <tbody id="leadsTable"><tr><td colspan="7" style="text-align:center;color:var(--sub);">Chargement...</td></tr></tbody>
    </table>
    <p class="last-update" id="lastUpdate"></p>
  </div>
</div>

<script>
const PASSWORD = "nexlead2026";
const DASHBOARD_URL = "https://desktop-bsdpr8a.tail0f3da6.ts.net/webhook/dashboard";

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

// Extrait une valeur depuis la structure HubSpot : { value: "xxx" }
function getProp(contact, key) {
  if (!contact || !contact.properties || !contact.properties[key]) return "";
  const prop = contact.properties[key];
  if (prop && typeof prop === 'object' && 'value' in prop) {
    return String(prop.value);
  }
  return String(prop);
}

// Extrait l'email depuis identity-profiles
function getEmail(contact) {
  try {
    if (!contact || !contact["identity-profiles"] || !contact["identity-profiles"][0]) return "";
    const identities = contact["identity-profiles"][0].identities || [];
    const emailId = identities.find(i => i.type === "EMAIL");
    return emailId ? String(emailId.value) : "";
  } catch(e) { return ""; }
}

// Déduit le pays depuis le TLD de l'email
function getCountryFromEmail(email) {
  if (!email) return "Non spécifié";
  const parts = email.split('@');
  if (parts.length < 2) return "Non spécifié";
  const domain = parts[1];
  const tld = domain.split('.').pop().toLowerCase();
  
  const map = {
    'fr': 'France 🇫🇷', 'be': 'Belgique 🇧🇪', 'ch': 'Suisse 🇨🇭', 'ca': 'Canada 🇨🇦',
    'dz': 'Algérie 🇩🇿', 'ma': 'Maroc 🇲🇦', 'tn': 'Tunisie 🇹🇳', 'ae': 'Émirats 🇦🇪',
    'qa': 'Qatar 🇶🇦', 'sa': 'Arabie S. 🇸🇦', 'eg': 'Égypte 🇪🇬', 'us': 'USA 🇺🇸',
    'co.uk': 'UK 🇬🇧', 'uk': 'UK 🇬🇧', 'de': 'Allemagne 🇩🇪', 'es': 'Espagne 🇪🇸', 
    'it': 'Italie 🇮🇹', 'pt': 'Portugal 🇵🇹', 'nl': 'Pays-Bas 🇳🇱',
    'jp': 'Japon 🇯🇵', 'cn': 'Chine 🇨🇳', 'in': 'Inde 🇮🇳', 'br': 'Brésil 🇧🇷'
  };
  
  if (map[tld]) return map[tld];
  
  // Vérifie si c'est un email pro (pas gmail, yahoo, etc.)
  const freeProviders = ['gmail', 'yahoo', 'hotmail', 'outlook', 'aol', 'protonmail', 'icloud', 'live', 'msn'];
  const domainName = domain.split('.')[0].toLowerCase();
  if (freeProviders.includes(domainName)) return "International 🌍";
  
  return "International 🌍";
}

// Calcule un score basé sur la complétude du profil
function calculateScore(contact) {
  let score = 0;
  if (getProp(contact, "firstname")) score += 15;
  if (getProp(contact, "lastname")) score += 15;
  if (getProp(contact, "company")) score += 30;
  
  const email = getEmail(contact);
  if (email) {
    score += 20;
    // Bonus pour email pro
    const freeProviders = ['gmail', 'yahoo', 'hotmail', 'outlook', 'aol', 'protonmail', 'icloud'];
    const domain = email.split('@')[1]?.split('.')[0].toLowerCase();
    if (!freeProviders.includes(domain)) score += 20;
  }
  
  return Math.min(score, 100);
}

// Convertit un timestamp HubSpot (ms) en date lisible
function formatDate(timestamp) {
  if (!timestamp) return new Date().toISOString().slice(0, 10);
  const ts = typeof timestamp === 'string' ? parseInt(timestamp, 10) : timestamp;
  if (isNaN(ts)) return new Date().toISOString().slice(0, 10);
  const d = new Date(ts);
  if (isNaN(d.getTime())) return new Date().toISOString().slice(0, 10);
  return d.toISOString().slice(0, 10);
}

function unlock() {
  if (document.getElementById("passInput").value === PASSWORD) {
    document.getElementById("lockScreen").style.display = "none";
    document.getElementById("mainContent").style.display = "block";
    document.getElementById("currentDate").textContent = new Date().toLocaleDateString('fr-FR', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
    loadDashboard();
  } else {
    alert("Mot de passe incorrect");
  }
}

async function loadDashboard() {
  try {
    document.getElementById("leadsTable").innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--sub);">Chargement...</td></tr>';
    
    const response = await fetch(DASHBOARD_URL);
    if (!response.ok) throw new Error("HTTP " + response.status);
    
    let rawData = await response.json();
    
    // Déballage si nécessaire
    let data = rawData;
    if (Array.isArray(rawData) && rawData[0]?.json) {
      data = rawData[0].json;
    }
    
    // S'assure que c'est un tableau
    if (!Array.isArray(data)) data = [data];

    const contacts = data.map(c => {
      const email = getEmail(c);
      const score = calculateScore(c);
      const statut = score >= 70 ? "CHAUD" : (score >= 40 ? "TIEDE" : "FROID");
      
      return {
        firstname: getProp(c, "firstname") || "Sans prénom",
        lastname: getProp(c, "lastname") || "Sans nom",
        email: email,
        company: getProp(c, "company") || "-",
        country: getCountryFromEmail(email),
        score: score,
        statut: statut,
        date: formatDate(c.addedAt || getProp(c, "createdate"))
      };
    });

    updateDashboard(contacts);
  } catch (e) {
    console.error("Erreur:", e);
    document.getElementById("leadsTable").innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--red);">Erreur : ' + escapeHtml(e.message) + '</td></tr>';
  }
}

function updateDashboard(contacts) {
  const total = contacts.length;
  const hot = contacts.filter(l => l.statut === "CHAUD").length;
  const warm = contacts.filter(l => l.statut === "TIEDE").length;
  const cold = contacts.filter(l => l.statut === "FROID").length;
  const today = new Date().toISOString().split('T')[0];

  document.getElementById("total").textContent = total;
  document.getElementById("hot").textContent = hot;
  document.getElementById("warm").textContent = warm;
  document.getElementById("cold").textContent = cold;
  
  const todayCount = contacts.filter(l => l.date === today).length;
  document.getElementById("todayLeads").textContent = todayCount > 0 ? "+" + todayCount + " aujourd'hui" : "Aucun aujourd'hui";

  if (total > 0) {
    const hotPct = Math.round(hot/total*100);
    const warmPct = Math.round(warm/total*100);
    const coldPct = Math.round(cold/total*100);
    document.getElementById("hotPct").textContent = hotPct + "%";
    document.getElementById("warmPct").textContent = warmPct + "%";
    document.getElementById("coldPct").textContent = coldPct + "%";
    document.getElementById("hotBar").style.width = hotPct + "%";
    document.getElementById("warmBar").style.width = warmPct + "%";
    document.getElementById("coldBar").style.width = coldPct + "%";
  }

  const countries = {};
  contacts.forEach(l => { 
    const key = l.country || "Inconnu";
    countries[key] = (countries[key] || 0) + 1; 
  });
  
  document.getElementById("countryStats").innerHTML = Object.entries(countries)
    .sort((a,b) => b[1]-a[1]).slice(0, 10)
    .map(([c, n]) => '<div class="bar-label"><span>' + escapeHtml(c) + '</span><span>' + n + ' leads</span></div><div class="bar"><div class="bar-fill" style="width:' + (total > 0 ? Math.round(n/total*100) : 0) + '%;background:var(--purple);"></div></div>').join("");

  document.getElementById("leadsTable").innerHTML = contacts.slice().reverse().map(l => {
    const name = escapeHtml(l.firstname) + ' ' + escapeHtml(l.lastname);
    return '<tr><td><strong>' + name + '</strong></td><td>' + escapeHtml(l.company) + '</td><td>' + escapeHtml(l.country) + '</td><td>' + escapeHtml(l.email) + '</td><td>' + l.score + '/100</td><td><span class="badge badge-' + l.statut + '">' + escapeHtml(l.statut) + '</span></td><td>' + escapeHtml(l.date) + '</td></tr>';
  }).join("");

  document.getElementById("lastUpdate").textContent = "Dernière mise à jour : " + new Date().toLocaleTimeString('fr-FR');
}
</script>
</body>
</html>
